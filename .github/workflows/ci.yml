# 协议层 SDK：只放协议不放业务（见 README 的边界表）。检查全部离线可跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (build / vet / gofmt / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"   # 与 go.mod 的 go 指令一致
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt 未格式化："; echo "$unformatted"; exit 1; fi
      - name: go test
        run: go test ./... -count=1
